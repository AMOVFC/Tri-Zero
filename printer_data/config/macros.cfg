#####################################################################
# Macros
#####################################################################

[delayed_gcode STARTUP_FAN_DEFAULT]
initial_duration: 2.0
gcode:
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.10

[delayed_gcode FANS_IDLE]
gcode:
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.10

[delayed_gcode RENDER_TIMELAPSE]
gcode:
    TIMELAPSE_RENDER

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel the running print and park the toolhead
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    G91
    G1 Z{[10, max_z - cur_z]|min} F900
    G90
    G0 X60 Y{max_y - 10} F6000
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.10
    M107
    M84
    SET_PIN PIN=caselight VALUE=0
    M117 Print cancelled

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause the print and park the toolhead
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% set E = params.E|default(1.5)|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{[Z, max_z - cur_z]|min} F900
    G90
    G1 X{X} Y{Y} F6000
    M117 Paused - change filament then RESUME

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume the print from pause
gcode:
    {% set E = params.E|default(1.5)|float %}
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME
    M117 Resuming...

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customize for your slicer of choice
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set PREHEAT_TEMP = params.PREHEAT_TEMP|default(180)|float %}

    M117 Starting print: preheating...
    SET_PIN PIN=caselight VALUE=1.0
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.5
    M104 S{PREHEAT_TEMP}
    M190 S{BED_TEMP}

    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5

    G90
    G1 X10 Y10 Z10 F1200

    M117 Switching to print temperatures...
    M109 S{EXTRUDER_TEMP}
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.75
    LINE_PURGE
   
[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    G1 E-4 F3600

    # Limits
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    # Current position
    {% set x = printer.toolhead.position.x|float %}
    {% set y = printer.toolhead.position.y|float %}
    {% set z = printer.toolhead.position.z|float %}

    # Safe relative moves
    {% set x_move = 20 if x < (max_x - 20) else -20 %}
    {% set y_move = 20 if y < (max_y - 20) else -20 %}
    {% set z_lift = 30 if z < (max_z - 30) else (max_z - z) %}

    G91
    G0 Z{z_lift} F3600
    G0 X{x_move} Y{y_move} F20000
    G1 E-20 F3600

    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=cooling_fan SPEED=0.4
    M107

    G90
    G0 X60 Y{max_y-10} F3600

    M84
    SET_PIN PIN=caselight VALUE=0
    UPDATE_DELAYED_GCODE ID=RENDER_TIMELAPSE DURATION=5
    UPDATE_DELAYED_GCODE ID=FANS_IDLE DURATION=600


[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E30 F300                    ; load
   G1 E15 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E10 F300                    ; extrude a little to soften tip
   G1 E-40 F1800                  ; retract some, but not too much or it will jam
   M82                            ; set extruder to absolute

[gcode_macro _HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    # {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    # {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    # {% set HOME_CURRENT_RATIO = 0.7 %} # by default we are dropping the motor current during homing. you can adjust this value if you are having trouble with skipping while homing
    # SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_X}
    # SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_Y}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait for StallGuard registers to clear
    M400
    G90
    # Set current during print
    # SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    # SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    # Set current for sensorless homing
    # {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    # {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    # {% set HOME_CURRENT_RATIO = 0.7 %} # by default we are dropping the motor current during homing. you can adjust this value if you are having trouble with skipping while homing
    # SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_X}
    # SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_Y}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait for StallGuard registers to clear
    M400
    G90
    # Set current during print
    # SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    # SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[gcode_macro CUT_FILAMENT]
description: Move toolhead to filament cutter and perform cut stroke. Retraction handled by caller.
gcode:
    # ===== Cutter geometry =====
    {% set safe_x     = 20  %}   # X clear of the lever (used for approach + retreat)
    {% set approach_x = -3  %}   # X of approach point (aligned with cutter)
    {% set approach_y = 60  %}   # Y of approach point (below cutter)
    {% set cut_x      = -3  %}   # X during cut stroke
    {% set cut_y      = 120  %}   # Y at end of cut stroke (past the pin)
    {% set release_x  = 20  %}   # X to move to after cut to release the lever
    {% set park_x     = 60  %}   # X park position
    {% set park_y     = 60  %}   # Y park position
    # ===== Speeds =====
    {% set travel_speed = 500 %}   # mm/sec for XY travel
    {% set cut_speed    = 100  %}   # mm/sec for the cut stroke (slower = more force)
    # ===========================================================

    # Param: PARK=1 to move to park after cut, PARK=0 to leave at release point
    {% set park = params.PARK|default(0)|int %}

    # Home only if needed
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90                                              # absolute positioning
    G1 X{safe_x} Y{approach_y} F{travel_speed}       # come in at safe X, below cutter
    G1 X{approach_x} Y{approach_y} F{travel_speed}   # slide left into approach point
    G1 X{cut_x} Y{cut_y} F{cut_speed}                # drive Y past pin — the cut
    G1 X{release_x} F{travel_speed}                  # slide right to release lever

    {% if park %}
        G1 X{park_x} Y{park_y} F{travel_speed}       # move to park
    {% endif %}

