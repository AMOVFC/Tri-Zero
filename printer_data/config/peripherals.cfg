#####################################################################
# MCU & Host Temperature Sensors
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#####################################################################
#   Display / EXP Header Pin Aliases (UNUSED — define if adding a display)
#####################################################################
## Leviathan V1.1 EXP1/EXP2 header pin mapping. Uncomment if you wire up
## a RepRapDiscount, mini12864, or similar display module.
#
# [board_pins]
# aliases:
#     # EXP1 header
#     EXP1_1=PG9,  EXP1_2=PG12,
#     EXP1_3=PG13, EXP1_4=PG14,
#     EXP1_5=PC13, EXP1_6=PC14,
#     EXP1_7=PC15, EXP1_8=PF0,
#     EXP1_9=<GND>, EXP1_10=<5V>,
#     # EXP2 header
#     EXP2_1=PA6, EXP2_2=PA5,
#     EXP2_3=PE2, EXP2_4=PE4,
#     EXP2_5=PE3, EXP2_6=PA7,
#     EXP2_7=PE5, EXP2_8=<RST>,
#     EXP2_9=<GND>, EXP2_10=PE4
