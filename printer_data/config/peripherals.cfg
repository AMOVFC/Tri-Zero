#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
pin: PE6                                    # Leviathan LED-STRIP
pwm:true
# hardware_pwm: False
# value: 0.80 #startup value
shutdown_value: 0
# value:1
cycle_time: 0.01

## Mainboard Neopixel (UNUSED) — Leviathan NEOPIXEL header is PF10.
# [neopixel rgb_light]
# pin: PF10
# chain_count: 3
# color_order: GRBW
# initial_RED: 0.0
# initial_GREEN: 0.0
# initial_BLUE: 0.0
# initial_WHITE: 0.0

#####################################################################
#   Filament Runout Sensor (UNUSED) — Leviathan FILAMENT header is PC0
#####################################################################
# [filament_switch_sensor Filament]
