#####################################################################
# Controller Fans (mainboard FAN2 / FAN3 slots)
#####################################################################
# [fan_generic nevermore]
# pin: PB7
# kick_start_time: 0.1
# shutdown_speed: 0.0
# max_power: 1.0


[fan_generic cooling_fan]
pin: PB7
tachometer_pin: PB8
tachometer_ppr: 2
# stepper: stepper_x, stepper_y
# fan_speed: 1.0
# kick_start_time: 0.5
# idle_timeout: 30
# idle_speed: 0.3

