#####################################################################
# Includes
#####################################################################
[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include macros.cfg]
[include TEST_SPEED.cfg]
[include timelapse.cfg]
[include shell_command.cfg]
[include git.cfg]
[include nevermore.cfg]
[include nozzlewiper.cfg]
[include reshelper.cfg]

[include steppers.cfg]
[include extruder.cfg]
[include bed.cfg]
[include probe.cfg]
[include peripherals.cfg]

# [include V0Display.cfg]
# This file contains common pin mappings for the BIGTREETECH SKR Pico V1.0
# To use this config, the firmware should be compiled for the RP2040 with
# USB communication.


#####################################################################
# Base sections
#####################################################################
[display_status]
[respond]
[gcode_arcs]
[pause_resume]
[exclude_object]
[force_move]
enable_force_move : true

#####################################################################
# MCU
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_3A0046001451333135363231-if00
## serial: /dev/ttyAMA0 											# for UART connection
restart_method: command

#####################################################################
# Printer kinematics & motion tuning
#####################################################################
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 35000
max_z_velocity: 500
max_z_accel: 10000
square_corner_velocity: 9.0

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 66.2
damping_ratio_x: 0.055

shaper_type_y: mzv 
shaper_freq_y: 43.0
damping_ratio_x: 0.055

