#####################################################################
#      X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to HV STEPPER 0 on Leviathan V1.1
##  Endstop: sensorless (TMC5160 virtual). Hardware pin PC1 reserved.
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc5160_stepper_x:virtual_endstop
# endstop_pin: PC1                                                  # Hardware X endstop pin (Leviathan X-ENDSTOP) — uncomment to use physical switch
position_endstop: 120
position_max: 120
position_min: -3
homing_speed: 90
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PE15
spi_bus: spi4
diag0_pin: ^!PG1
interpolate: true
run_current: 2 #max 2.5
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 2    # this is set to 63
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 3

##  A Stepper - Right
##  Connected to HV STEPPER 1 on Leviathan V1.1
##  Endstop: sensorless (TMC5160 virtual). Hardware pin PC2 reserved.
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc5160_stepper_y:virtual_endstop
# endstop_pin: PC2                                                  # Hardware Y endstop pin (Leviathan Y-ENDSTOP) — uncomment to use physical switch
position_endstop: 116
position_max: 116
homing_speed: 90
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PE11
spi_bus: spi4
diag0_pin: ^!PE10
interpolate: true
run_current: 2 #max 2.5
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 2    # this is set to 63
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 3

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Right
## Connected to STEPPER 0 on Leviathan V1.1
## Endstop: probe:z_virtual_endstop. Hardware pin PC3 reserved.
[stepper_z] #front right
step_pin: PD4  
dir_pin: !PD3
enable_pin: !PD7  
endstop_pin: probe:z_virtual_endstop
# endstop_pin: ^PC3                                                 # Hardware Z endstop pin (Leviathan Z-ENDSTOP) — uncomment to use physical switch
rotation_distance: 32                                             
microsteps: 32
# position_endstop: 120
position_max: 120
position_min: -25
homing_speed: 5
second_homing_speed: 3.0
homing_retract_dist: 2.0
homing_positive_dir: false


[tmc2209 stepper_z]
uart_pin: PD5
#diag_pin: ^!PD6
interpolate: false
run_current: 0.8 #max 1.5
sense_resistor: 0.110
stealthchop_threshold: 0   

## Z1 Stepper - Front Left
## Connected to STEPPER 1 on Leviathan V1.1
[stepper_z1]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2 
endstop_pin: probe:z_virtual_endstop
rotation_distance: 32                                                
microsteps: 32


[tmc2209 stepper_z1] # front left
uart_pin: PD0
#diag_pin: ^!PD1
interpolate: false
run_current: 0.8 #max 1.5
sense_resistor: 0.110
stealthchop_threshold: 0   

## Z2 Stepper - Rear Center
## Connected to STEPPER 2 on Leviathan V1.1
[stepper_z2] # back motor
step_pin: PC9
dir_pin: !PC8
enable_pin: !PC10  
endstop_pin: probe:z_virtual_endstop
rotation_distance: 32                                                
microsteps: 32


[tmc2209 stepper_z2]
uart_pin: PA8
#diag_pin: ^!PA15
interpolate: false
run_current: 0.8 #max 1.5
sense_resistor: 0.110
stealthchop_threshold: 0   

